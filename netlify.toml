# Fallback hosting config for Netlify (mirrors vercel.json behavior).
# Lovable hosting ignores this file; it is only used if you deploy to Netlify.

[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback — every non-asset route serves index.html so React Router can handle it.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long-cache hashed assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
