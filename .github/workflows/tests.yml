name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  auth-context-tests:
    name: AuthContext test suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run AuthContext tests with coverage
        run: bunx vitest run --coverage src/contexts/AuthContext.test.tsx

      # Dedicated flicker-regression gate. Runs only the loading-transition
      # flicker tests with -t (test-name filter). If any of these fail, CI
      # fails loudly with a clear "flicker regression" signal in the logs.
      - name: Flicker regression gate (loading transitions)
        run: |
          set -e
          echo "::group::Flicker regression gate"
          if ! bunx vitest run src/contexts/AuthContext.test.tsx \
                -t "no UI flicker|without flicker"; then
            echo "::error title=Loading flicker regression::AuthContext loading-transition flicker regression detected. The 'loading' state flipped more than once per listener event. See test output above."
            exit 1
          fi
          echo "::endgroup::"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/

  google-verification-guard:
    name: Google Search Console verification guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build production bundle
        run: bunx vite build
      - name: Verify Google verification file in build output
        run: node scripts/verify-google-site.mjs
