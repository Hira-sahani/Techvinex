name: Deploy Supabase (external project)

# Manual-only. This workflow NEVER auto-runs.
# It targets the production Supabase project referenced by the
# SUPABASE_PROJECT_REF_PROD repository secret.
# Do not add push/pull_request triggers.
#
# Safety guarantees:
#   * Requires the operator to re-type the target ref as confirm_ref.
#   * Never runs `supabase db reset` or any destructive command.
#   * `supabase db push` only applies migrations that are NOT yet
#     recorded in supabase_migrations.schema_migrations on the target.
#   * Fails fast: `set -euo pipefail` on every scripted step.

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Which stage to run
        required: true
        default: readiness-only
        type: choice
        options:
          - readiness-only        # stages 1-3: validate secrets, link, report schema drift. No writes.
          - repair-history        # stages 1-2R: validate secrets, link, repair schema_migrations bookkeeping only (no SQL).
          - verify-only           # stages 1-2 + 2V: strict READ-ONLY post-deployment verification. No writes.
          - migrate-only          # stages 1-4: readiness + apply pending migrations only.
          - functions-only        # stages 1-3 + 5-6: readiness + deploy & verify all edge functions.
          - mcp-only              # stages 1-2 + M: rebuild + deploy ONLY the `mcp` edge function against the target project ref.
          - full-cutover          # stages 1-8: readiness + migrate + deploy + verify + secrets audit.
      confirm_ref:
        description: Type the target project ref exactly (safety check)
        required: true
        type: string

concurrency:
  group: deploy-supabase-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cutover:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF_PROD }}
    steps:
      # -----------------------------------------------------------------
      # STAGE 1 — Validate required GitHub Secrets & inputs
      # -----------------------------------------------------------------
      - name: "Stage 1 · Validate required GitHub Secrets"
        run: |
          set -euo pipefail
          missing=0
          check() {
            if [ -z "${2:-}" ]; then
              echo "::error::Missing required secret: $1"
              missing=1
            else
              echo "  ✓ $1 is set"
            fi
          }
          echo "Checking required repository secrets…"
          check SUPABASE_ACCESS_TOKEN     "$SUPABASE_ACCESS_TOKEN"
          check SUPABASE_DB_PASSWORD      "$SUPABASE_DB_PASSWORD"
          check SUPABASE_PROJECT_REF_PROD "$PROJECT_REF"
          if [ "$missing" -ne 0 ]; then
            echo "::error::Add the missing secrets in Settings → Secrets and variables → Actions, then re-run."
            exit 1
          fi


      - name: "Stage 1 · Guard — confirm_ref matches secret"
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirm_ref }}" != "$PROJECT_REF" ]; then
            echo "::error::confirm_ref input does not match SUPABASE_PROJECT_REF_PROD. Aborting."
            exit 1
          fi
          echo "  ✓ confirm_ref matches SUPABASE_PROJECT_REF_PROD."

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.39.2

      # -----------------------------------------------------------------
      # STAGE 2 — Link Supabase CLI to the target project
      # -----------------------------------------------------------------
      - name: "Stage 2 · Link Supabase CLI to target project"
        run: |
          set -euo pipefail
          # --project-ref overrides supabase/config.toml, so a stale
          # config.toml written by Lovable does NOT redirect this job.
          supabase link --project-ref "$PROJECT_REF"
          echo "  ✓ Linked to $PROJECT_REF"

      # -----------------------------------------------------------------
      # STAGE 2V — verify-only: strict READ-ONLY post-deployment verification
      #   * Compares local vs remote migration versions (sets must match).
      #   * Compares local supabase/functions/* vs deployed edge functions.
      #   * Runs safe HTTP smoke tests on public/read-only endpoints only.
      #   * Runs `supabase db diff` for schema drift review (does NOT apply).
      #   * Never writes: no db push, no migration repair, no function deploy,
      #     no secret changes, no destructive HTTP calls.
      # -----------------------------------------------------------------
      - name: "Stage 2V · Prepare verification evidence dir"
        if: ${{ inputs.stage == 'verify-only' }}
        run: |
          set -euo pipefail
          mkdir -p verification-evidence
          : > verification-evidence/migration_verification.txt
          : > verification-evidence/function_verification.txt
          : > verification-evidence/smoke_test_results.txt
          : > verification-evidence/schema_diff.sql
          : > verification-evidence/final_verification_summary.txt

      - name: "Stage 2V · Migration set verification (read-only)"
        if: ${{ inputs.stage == 'verify-only' }}
        id: verify_migrations
        run: |
          set -euo pipefail
          OUT=verification-evidence/migration_verification.txt
          RAW=verification-evidence/migration_list_raw.txt

          # Capture the migration list. Preserve exit code of the CLI itself.
          set -o pipefail
          if ! supabase migration list --linked 2>&1 | tee "$RAW"; then
            echo "FAIL: supabase migration list --linked errored" | tee -a "$OUT"
            echo "migrations_result=FAIL" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          # Parse Local (col 1) and Remote (col 2). Strip ANSI, backticks, whitespace.
          # Accept only 14-digit versions.
          LOCAL_VERSIONS=$(sed 's/\x1B\[[0-9;]*[a-zA-Z]//g' "$RAW" | awk -F'|' '
            NR == 1 { next }
            /^[[:space:]]*-+[[:space:]]*\|/ { next }
            NF >= 1 {
              v = $1
              gsub(/[\x60[:space:]]/, "", v)
              if (v ~ /^[0-9]{14}$/) print v
            }
          ' | sort -u)

          REMOTE_VERSIONS=$(sed 's/\x1B\[[0-9;]*[a-zA-Z]//g' "$RAW" | awk -F'|' '
            NR == 1 { next }
            /^[[:space:]]*-+[[:space:]]*\|/ { next }
            NF >= 2 {
              v = $2
              gsub(/[\x60[:space:]]/, "", v)
              if (v ~ /^[0-9]{14}$/) print v
            }
          ' | sort -u)

          {
            echo "Local versions:"
            echo "$LOCAL_VERSIONS" | sed 's/^/  /'
            echo "Remote versions:"
            echo "$REMOTE_VERSIONS" | sed 's/^/  /'
          } >> "$OUT"

          MISSING_REMOTE=$(comm -23 <(printf '%s\n' "$LOCAL_VERSIONS") <(printf '%s\n' "$REMOTE_VERSIONS") || true)
          MISSING_LOCAL=$(comm -13  <(printf '%s\n' "$LOCAL_VERSIONS") <(printf '%s\n' "$REMOTE_VERSIONS") || true)

          fail=0
          if [ -n "$MISSING_REMOTE" ]; then
            echo "FAIL: versions missing on remote:" | tee -a "$OUT"
            echo "$MISSING_REMOTE" | sed 's/^/  /' | tee -a "$OUT"
            fail=1
          fi
          if [ -n "$MISSING_LOCAL" ]; then
            echo "FAIL: versions missing locally:" | tee -a "$OUT"
            echo "$MISSING_LOCAL" | sed 's/^/  /' | tee -a "$OUT"
            fail=1
          fi

          if [ "$fail" -eq 0 ]; then
            echo "PASS: Local and Remote migration sets match." | tee -a "$OUT"
            echo "migrations_result=PASS" >> "$GITHUB_OUTPUT"
          else
            echo "RESULT: FAIL" | tee -a "$OUT"
            echo "migrations_result=FAIL" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: "Stage 2V · Edge Function deployment verification (read-only)"
        if: ${{ inputs.stage == 'verify-only' }}
        id: verify_functions
        run: |
          set -euo pipefail
          OUT=verification-evidence/function_verification.txt
          RAW=verification-evidence/function_list_raw.txt

          # Expected: local supabase/functions/* excluding names starting with underscore.
          EXPECTED=$(find supabase/functions -mindepth 1 -maxdepth 1 -type d \
                       -not -name '_*' -printf '%f\n' | sort -u)

          set -o pipefail
          if ! supabase functions list --project-ref "$PROJECT_REF" 2>&1 | tee "$RAW" >/dev/null; then
            echo "FAIL: supabase functions list errored" | tee -a "$OUT"
            echo "functions_result=FAIL" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          # Parse function NAME column. Strip ANSI, backticks, whitespace.
          # `supabase functions list` prints a pipe-delimited table; NAME is typically column 2 (ID | NAME | ...),
          # but layouts vary — accept any pipe-delimited cell that looks like a slug and is not "NAME"/"ID".
          DEPLOYED=$(sed 's/\x1B\[[0-9;]*[a-zA-Z]//g' "$RAW" | awk -F'|' '
            /^[[:space:]]*-+[[:space:]]*\|/ { next }
            {
              for (i = 1; i <= NF; i++) {
                v = $i
                gsub(/[\x60[:space:]]/, "", v)
                if (v ~ /^[a-z][a-z0-9-]{1,}$/ && v != "name" && v != "id" && v != "slug" && v != "verify_jwt" && v != "true" && v != "false" && v != "status" && v != "active") {
                  print v
                }
              }
            }
          ' | sort -u)

          # Intersect DEPLOYED with EXPECTED ∪ (anything that looks like a real function name).
          # We use EXPECTED as ground truth for the "missing" check; DEPLOYED set is compared for extras.
          MISSING=$(comm -23 <(printf '%s\n' "$EXPECTED") <(printf '%s\n' "$DEPLOYED") || true)
          EXTRA=$(comm -13  <(printf '%s\n' "$EXPECTED") <(printf '%s\n' "$DEPLOYED") || true)

          {
            echo "Expected (local) functions:"
            echo "$EXPECTED" | sed 's/^/  /'
            echo "Deployed (remote) functions (parsed):"
            echo "$DEPLOYED" | sed 's/^/  /'
          } >> "$OUT"

          fail=0
          if [ -n "$MISSING" ]; then
            echo "FAIL: expected functions missing on remote:" | tee -a "$OUT"
            echo "$MISSING" | sed 's/^/  /' | tee -a "$OUT"
            fail=1
          fi
          if [ -n "$EXTRA" ]; then
            echo "WARNING: extra remote functions not present locally (NOT deleted):" | tee -a "$OUT"
            echo "$EXTRA" | sed 's/^/  /' | tee -a "$OUT"
          fi

          if [ "$fail" -eq 0 ]; then
            echo "PASS: All expected functions are deployed." | tee -a "$OUT"
            echo "functions_result=PASS" >> "$GITHUB_OUTPUT"
          else
            echo "RESULT: FAIL" | tee -a "$OUT"
            echo "functions_result=FAIL" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: "Stage 2V · Safe HTTP smoke tests (read-only endpoints only)"
        if: ${{ inputs.stage == 'verify-only' }}
        id: smoke_tests
        run: |
          set -euo pipefail
          OUT=verification-evidence/smoke_test_results.txt
          BASE="https://${PROJECT_REF}.functions.supabase.co"

          # Curated allow-list of endpoints that are safe to call (GET only, no writes,
          # no AI jobs, no email, no payments, no uploads, no admin, no unknown bodies).
          # Anything else in supabase/functions/ is verified as DEPLOYED-only and SKIPPED.
          SAFE_GET=(
            "public-sitemap"
            "public-sentry-config"
            "public-explore-jobs"
          )

          # Endpoints that must NEVER be invoked by verify-only. Presence is checked only.
          SKIP_REASON_admin_cleanup="admin action"
          SKIP_REASON_admin_explore_job_notes="admin action"
          SKIP_REASON_admin_mark_scan_reviewed="admin action / DB write"
          SKIP_REASON_admin_secrets="admin action / secret access"
          SKIP_REASON_admin_view_payout="admin action"
          SKIP_REASON_ai_approval_decide="AI job / DB write"
          SKIP_REASON_ai_interview="AI job / paid API"
          SKIP_REASON_ai_job_worker="AI job / DB write"
          SKIP_REASON_ai_safe_action="AI job / DB write"
          SKIP_REASON_benchmark_task_secret="auth required / secret access"
          SKIP_REASON_csp_report="write-only report ingestion"
          SKIP_REASON_elevenlabs_tts="paid external API"
          SKIP_REASON_enqueue_ai_job="AI job / DB write"
          SKIP_REASON_get_ai_job_status="auth required / unknown body"
          SKIP_REASON_openai_benchmark="paid external API / AI job"
          SKIP_REASON_scan_upload="file upload / DB write"
          SKIP_REASON_verify_admin="auth required"
          SKIP_REASON_verify_password="auth required / credential handling"
          SKIP_REASON_webhook_receiver="webhook ingest / DB write"

          fail=0
          # Iterate deployed-local intersection so we only smoke local-known functions.
          EXPECTED=$(find supabase/functions -mindepth 1 -maxdepth 1 -type d \
                       -not -name '_*' -printf '%f\n' | sort -u)

          echo "Smoke test base: $BASE" >> "$OUT"

          for fn in $EXPECTED; do
            safe=0
            for s in "${SAFE_GET[@]}"; do
              if [ "$fn" = "$s" ]; then safe=1; break; fi
            done

            if [ "$safe" -eq 1 ]; then
              # HEAD/GET without Authorization. Never print JWTs/keys/headers/bodies.
              code=$(curl -sS -o /tmp/smoke_body.$$ -w '%{http_code}' \
                        -H 'Accept: */*' \
                        --max-time 15 \
                        "$BASE/$fn" || echo "000")
              ct=$(file --mime-type -b /tmp/smoke_body.$$ 2>/dev/null || echo "unknown")
              rm -f /tmp/smoke_body.$$
              printf '  %-30s CALLED  HTTP %s  (%s)\n' "$fn" "$code" "$ct" | tee -a "$OUT"
              case "$code" in
                2*|3*|401|403|404|405) : ;;
                5*|000)
                  echo "    FAIL: unexpected response for $fn" | tee -a "$OUT"
                  fail=1
                  ;;
              esac
            else
              # Not in allow-list → SKIPPED with reason. Deployment existence was already verified in Stage 2V functions check.
              key="SKIP_REASON_$(echo "$fn" | tr '-' '_')"
              reason="${!key:-not in read-only allow-list}"
              printf '  %-30s SKIPPED  reason: %s\n' "$fn" "$reason" | tee -a "$OUT"
            fi
          done

          if [ "$fail" -eq 0 ]; then
            echo "PASS: Safe smoke tests completed without unexpected 5xx." | tee -a "$OUT"
            echo "smoke_result=PASS" >> "$GITHUB_OUTPUT"
          else
            echo "RESULT: FAIL" | tee -a "$OUT"
            echo "smoke_result=FAIL" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: "Stage 2V · Schema drift check (read-only, non-destructive)"
        if: ${{ inputs.stage == 'verify-only' }}
        id: schema_diff
        run: |
          set -euo pipefail
          OUT=verification-evidence/schema_diff.sql
          set -o pipefail
          if ! supabase db diff --linked --schema public --schema storage 2>&1 | tee "$OUT"; then
            echo "-- COMMAND_FAILED" >> "$OUT"
            echo "diff_result=COMMAND_FAILED" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          # Non-empty diff = review required; empty diff = clean.
          if grep -qE '[^[:space:]]' "$OUT"; then
            echo "diff_result=REVIEW_REQUIRED" >> "$GITHUB_OUTPUT"
          else
            echo "diff_result=EMPTY" >> "$GITHUB_OUTPUT"
          fi

      - name: "Stage 2V · Final verification summary"
        if: ${{ always() && inputs.stage == 'verify-only' }}
        run: |
          set -euo pipefail
          SUMMARY=verification-evidence/final_verification_summary.txt
          MIG='${{ steps.verify_migrations.outputs.migrations_result }}'
          FUN='${{ steps.verify_functions.outputs.functions_result }}'
          SMK='${{ steps.smoke_tests.outputs.smoke_result }}'
          DIF='${{ steps.schema_diff.outputs.diff_result }}'

          # Steps that never ran (earlier failure) surface as empty → mark FAIL.
          MIG="${MIG:-FAIL}"
          FUN="${FUN:-FAIL}"
          SMK="${SMK:-FAIL}"
          DIF="${DIF:-COMMAND_FAILED}"

          overall="PASS"
          if [ "$MIG" != "PASS" ] || [ "$FUN" != "PASS" ] || [ "$SMK" != "PASS" ] || [ "$DIF" = "COMMAND_FAILED" ]; then
            overall="FAIL"
          elif [ "$DIF" = "REVIEW_REQUIRED" ]; then
            overall="REVIEW_REQUIRED"
          fi

          {
            echo "MIGRATIONS: $MIG"
            echo "FUNCTION_DEPLOYMENT: $FUN"
            echo "SMOKE_TESTS: $SMK"
            echo "SCHEMA_DIFF: $DIF"
            echo "OVERALL_RESULT: $overall"
          } | tee "$SUMMARY"

          # verify-only exits non-zero on real failure; REVIEW_REQUIRED is a success
          # exit with the summary clearly flagging manual review.
          if [ "$overall" = "FAIL" ]; then
            exit 1
          fi

      - name: "Stage 2V · Upload verification evidence artifact"
        if: ${{ always() && inputs.stage == 'verify-only' }}
        uses: actions/upload-artifact@v4
        with:
          name: supabase-post-deployment-verification
          path: |
            verification-evidence/migration_verification.txt
            verification-evidence/function_verification.txt
            verification-evidence/smoke_test_results.txt
            verification-evidence/schema_diff.sql
            verification-evidence/final_verification_summary.txt
          if-no-files-found: warn
          retention-days: 14

      # -----------------------------------------------------------------
      # STAGE 2R — Repair migration history (metadata-only)
      # -----------------------------------------------------------------
      - name: "Stage 2R · Repair migration history"
        if: ${{ inputs.stage == 'repair-history' }}
        run: |
          set -euo pipefail
          echo "Repairing schema_migrations bookkeeping on $PROJECT_REF (metadata-only, no SQL executed)…"
          # Positional VERSION argument — the previous `--version` flag was silently
          # ignored by the current CLI, so the repair never actually ran against
          # the target and the remote column kept the old versions.
          supabase migration repair 20260710195548 --status reverted --linked
          supabase migration repair 20260710195546 --status applied  --linked
          supabase migration repair 20260710195611 --status reverted --linked
          supabase migration repair 20260710195606 --status applied  --linked
          echo "  ✓ Migration history repair commands completed."

      - name: "Stage 2R · Capture post-repair migration list"
        if: ${{ inputs.stage == 'repair-history' }}
        run: |
          set -euo pipefail
          mkdir -p repair-evidence
          echo "Post-repair migration list on $PROJECT_REF:"
          supabase migration list --linked 2>&1 | tee repair-evidence/post_repair_migration_list.txt

      - name: "Stage 2R · Verify Remote column reflects repair"
        if: ${{ inputs.stage == 'repair-history' }}
        run: |
          set -euo pipefail
          mkdir -p repair-evidence
          LIST_FILE=repair-evidence/post_repair_migration_list.txt
          VERIFY_FILE=repair-evidence/post_repair_verification.txt

          if [ ! -s "$LIST_FILE" ]; then
            echo "::error::Post-repair migration list file is missing or empty."
            exit 1
          fi

          # Parse the Remote column ONLY. `supabase migration list` prints a
          # pipe-delimited table: `Local | Remote | Time (UTC)`. The Remote
          # column may contain backticks, spaces, and ANSI color escape codes.
          # We strip those, then accept exactly 14-digit migration versions.
          # We do NOT grep the whole file — we look at the Remote column only.
          REMOTE_VERSIONS=$(sed 's/\x1B\[[0-9;]*[a-zA-Z]//g' "$LIST_FILE" | awk -F'|' '
            NR == 1 { next }                       # header row
            /^[[:space:]]*-+[[:space:]]*\|/ { next } # separator row
            NF >= 2 {
              remote = $2
              gsub(/[\x60[:space:]]/, "", remote)  # remove backticks and whitespace
              if (remote ~ /^[0-9]{14}$/) print remote
            }
          ' | sort -u)

          echo "Parsed Remote column versions:"
          echo "$REMOTE_VERSIONS" | sed 's/^/  /'

          {
            echo "Parsed Remote column versions:"
            echo "$REMOTE_VERSIONS" | sed 's/^/  /'
          } > "$VERIFY_FILE"

          must_have=(20260710195546 20260710195606)
          must_not_have=(20260710195548 20260710195611)
          fail=0

          for v in "${must_have[@]}"; do
            if echo "$REMOTE_VERSIONS" | grep -qx "$v"; then
              echo "  ✓ Remote contains $v"
              echo "PASS: Remote contains $v" >> "$VERIFY_FILE"
            else
              echo "::error::Remote column is missing required version $v"
              echo "FAIL: Remote missing $v" >> "$VERIFY_FILE"
              fail=1
            fi
          done

          for v in "${must_not_have[@]}"; do
            if echo "$REMOTE_VERSIONS" | grep -qx "$v"; then
              echo "::error::Remote column still contains forbidden version $v"
              echo "FAIL: Remote still contains $v" >> "$VERIFY_FILE"
              fail=1
            else
              echo "  ✓ Remote does not contain $v"
              echo "PASS: Remote does not contain $v" >> "$VERIFY_FILE"
            fi
          done

          if [ "$fail" -ne 0 ]; then
            echo "RESULT: FAIL" >> "$VERIFY_FILE"
            echo "::error::Migration history repair did not take effect on target."
            exit 1
          fi
          echo "RESULT: PASS" >> "$VERIFY_FILE"
          echo "  ✓ Remote column verification passed."

      - name: "Stage 2R · Upload repair evidence artifact"
        if: ${{ always() && inputs.stage == 'repair-history' }}
        uses: actions/upload-artifact@v4
        with:
          name: migration-repair-evidence
          path: |
            repair-evidence/post_repair_migration_list.txt
            repair-evidence/post_repair_verification.txt
          if-no-files-found: warn
          retention-days: 14

      # -----------------------------------------------------------------
      # STAGE 3 — Schema readiness (read-only, non-destructive)
      # -----------------------------------------------------------------
      - name: "Stage 3 · Readiness — list local migrations"
        if: ${{ inputs.stage != 'mcp-only' && inputs.stage != 'repair-history' && inputs.stage != 'verify-only' }}
        run: |
          set -euo pipefail
          echo "Local migrations in supabase/migrations/:"
          ls -1 supabase/migrations/ | sed 's/^/  /'
          count=$(ls -1 supabase/migrations/ | wc -l | tr -d ' ')
          echo "  → $count local migration file(s)"
          if [ "$count" -ne 44 ]; then
            echo "::warning::Expected 44 migrations, found $count. Continuing — verify this is intentional."
          fi

      - name: "Stage 3 · Readiness — migrations already applied on target"
        if: ${{ inputs.stage != 'mcp-only' && inputs.stage != 'repair-history' && inputs.stage != 'verify-only' }}
        run: |
          set -euo pipefail
          mkdir -p readiness-evidence
          echo "Applied migrations on $PROJECT_REF:"
          # Capture to file AND stdout. Preserve exit code of `supabase migration list`.
          set -o pipefail
          supabase migration list --linked 2>&1 | tee readiness-evidence/target_migration_list.txt

      - name: "Stage 3 · Readiness — dry-run diff (no changes)"
        if: ${{ inputs.stage != 'mcp-only' && inputs.stage != 'repair-history' && inputs.stage != 'verify-only' }}
        run: |
          set -euo pipefail
          mkdir -p readiness-evidence
          echo "Schema diff between repository and target (read-only):"
          # `db diff --linked` compares live target vs local migrations.
          # It does NOT write, reset, or apply anything.
          # Capture full raw SQL to file while still surfacing it in the log.
          # `set -o pipefail` ensures a `db diff` failure fails the step
          # (preserving the original exit-code behavior of the command).
          set -o pipefail
          supabase db diff --linked --schema public --schema storage \
            2>&1 | tee readiness-evidence/target_schema_diff.sql

      - name: "Stage 3 · Readiness — upload evidence artifact"
        if: ${{ always() && inputs.stage != 'mcp-only' && inputs.stage != 'repair-history' && inputs.stage != 'verify-only' }}
        uses: actions/upload-artifact@v4
        with:
          name: supabase-readiness-evidence
          path: |
            readiness-evidence/target_schema_diff.sql
            readiness-evidence/target_migration_list.txt
          if-no-files-found: warn
          retention-days: 14


      # -----------------------------------------------------------------
      # STAGE 4 — Apply only pending migrations (safe, non-destructive)
      # -----------------------------------------------------------------
      - name: "Stage 4 · Apply pending migrations"
        if: ${{ inputs.stage == 'migrate-only' || inputs.stage == 'full-cutover' }}
        run: |
          set -euo pipefail
          echo "Applying pending migrations to $PROJECT_REF (non-destructive)…"
          # `supabase db push` only applies migration files whose version
          # is NOT present in supabase_migrations.schema_migrations.
          # It never drops or resets existing objects.
          supabase db push --linked
          echo "  ✓ db push completed."
          echo "Post-push applied migrations:"
          supabase migration list --linked || true

      # -----------------------------------------------------------------
      # STAGE 5 — Deploy all repository Edge Functions
      # -----------------------------------------------------------------
      - name: "Stage 5 · Deploy edge functions"
        if: ${{ inputs.stage == 'functions-only' || inputs.stage == 'full-cutover' }}
        id: deploy_functions
        run: |
          set -euo pipefail
          deployed=()
          failed=()
          for dir in supabase/functions/*/; do
            name="$(basename "$dir")"
            if [ "$name" = "_shared" ]; then continue; fi
            echo "::group::deploy $name"
            if supabase functions deploy "$name" --project-ref "$PROJECT_REF"; then
              deployed+=("$name")
            else
              failed+=("$name")
              echo "::error::Deploy failed for $name"
            fi
            echo "::endgroup::"
          done
          echo "Deployed: ${deployed[*]:-<none>}"
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::Failed functions: ${failed[*]}"
            exit 1
          fi
          # Persist list for stage 6
          printf '%s\n' "${deployed[@]}" > /tmp/deployed_functions.txt

      # -----------------------------------------------------------------
      # STAGE 6 — Verify each deployed function boots (list + HEAD probe)
      # -----------------------------------------------------------------
      - name: "Stage 6 · Verify deployed functions"
        if: ${{ inputs.stage == 'functions-only' || inputs.stage == 'full-cutover' }}
        run: |
          set -euo pipefail
          echo "Registered functions on $PROJECT_REF:"
          supabase functions list --project-ref "$PROJECT_REF"

          echo
          echo "OPTIONS probe (checks the runtime boots and CORS layer responds):"
          base="https://${PROJECT_REF}.functions.supabase.co"
          fail=0
          while IFS= read -r name; do
            [ -z "$name" ] && continue
            code=$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS \
              -H 'Origin: https://admin.techvinex.com' \
              -H 'Access-Control-Request-Method: POST' \
              "$base/$name" || echo "000")
            printf '  %-30s HTTP %s\n' "$name" "$code"
            # 2xx or 204 = healthy; 401/403 also acceptable (guard rejected preflight is still a live boot).
            case "$code" in
              2*|3*|401|403|405) : ;;
              *) fail=1; echo "::warning::$name preflight returned $code" ;;
            esac
          done < /tmp/deployed_functions.txt
          if [ "$fail" -ne 0 ]; then
            echo "::error::One or more functions failed the preflight probe."
            exit 1
          fi
          echo "  ✓ All deployed functions responded to OPTIONS."

      # -----------------------------------------------------------------
      # STAGE M — Rebuild + deploy ONLY the `mcp` edge function.
      #   * Regenerates supabase/functions/mcp/index.ts via the Vite plugin
      #     with VITE_SUPABASE_PROJECT_ID pinned to the target PROJECT_REF,
      #     so the OAuth issuer baked into the function matches the target.
      #   * Deploys only `mcp` — never touches other functions.
      #   * Verifies the deployed function advertises the correct issuer via
      #     /.well-known/oauth-protected-resource.
      # -----------------------------------------------------------------
      - name: "Stage M · Setup Node for MCP rebuild"
        if: ${{ inputs.stage == 'mcp-only' }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: "Stage M · Setup Bun for MCP rebuild"
        if: ${{ inputs.stage == 'mcp-only' }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: "Stage M · Install deps (for Vite plugin)"
        if: ${{ inputs.stage == 'mcp-only' }}
        run: |
          set -euo pipefail
          # The repo uses Bun as its package manager (bun.lockb); there is no
          # committed package-lock.json, so `npm ci` fails with an out-of-sync
          # error. Use `bun install --frozen-lockfile` to match CI.
          bun install --frozen-lockfile

      - name: "Stage M · Pin target env for Vite build"
        if: ${{ inputs.stage == 'mcp-only' }}
        run: |
          set -euo pipefail
          # The committed .env file may not match the deploy target ref.
          # Vite's env-file precedence (production mode) is:
          #   .env.production.local > .env.production > .env.local > .env
          # This override guarantees the mcpPlugin inlines the target ref
          # regardless of what .env currently contains.
          cat > .env.production.local <<EOF
          VITE_SUPABASE_PROJECT_ID=${{ secrets.SUPABASE_PROJECT_REF_PROD }}
          VITE_SUPABASE_URL=https://${{ secrets.SUPABASE_PROJECT_REF_PROD }}.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY=ci-placeholder-not-used-at-runtime
          EOF
          echo "  .env.production.local written for target build."

      - name: "Stage M · Rebuild MCP function with target project ref"
        if: ${{ inputs.stage == 'mcp-only' }}
        env:
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_REF_PROD }}
          # Placeholder values so Vite's build succeeds even if runtime envs
          # are unset in CI. The MCP function only reads VITE_SUPABASE_PROJECT_ID.
          VITE_SUPABASE_URL: "https://${{ secrets.SUPABASE_PROJECT_REF_PROD }}.supabase.co"
          VITE_SUPABASE_PUBLISHABLE_KEY: "ci-placeholder-not-used-at-runtime"
        run: |
          set -euo pipefail
          echo "Rebuilding with VITE_SUPABASE_PROJECT_ID=$VITE_SUPABASE_PROJECT_ID"
          # The mcpPlugin() in vite.config.ts regenerates
          # supabase/functions/mcp/index.ts on every build with the current
          # env inlined. Frontend `dist/` output is discarded.
          bun run build


      - name: "Stage M · Verify generated function embeds target issuer"
        if: ${{ inputs.stage == 'mcp-only' }}
        run: |
          set -euo pipefail
          FILE=supabase/functions/mcp/index.ts
          if [ ! -f "$FILE" ]; then
            echo "::error::$FILE was not regenerated by the Vite build."
            exit 1
          fi
          if ! grep -q "\"$PROJECT_REF\"" "$FILE"; then
            echo "::error::Regenerated MCP function does not contain target ref $PROJECT_REF."
            echo "First 30 lines for diagnosis:"
            sed -n '1,30p' "$FILE"
            exit 1
          fi
          # Guard against any stale non-target ref leaking through.
          if grep -qE '"[a-z0-9]{20}"' "$FILE" && ! grep -q "\"$PROJECT_REF\"" "$FILE"; then
            echo "::error::Regenerated MCP function embeds a project ref other than $PROJECT_REF."
            exit 1
          fi
          echo "  ✓ Function embeds issuer for $PROJECT_REF."

      # NOTE: This workflow deliberately uses the OFFICIAL upstream deployment
      # path only. The generated supabase/functions/mcp/index.ts is deployed
      # AS-IS from the Vite plugin (mcpPlugin) output. No npm→esm.sh rewrite,
      # no vendoring, no defensive wrapper injection. Supabase's `supabase
      # functions deploy` handles `npm:` specifiers natively via eszip.




      - name: "Stage M · Pre-deploy target identity evidence"
        if: ${{ inputs.stage == 'mcp-only' }}
        run: |
          set -euo pipefail
          echo "=== TARGET IDENTITY (pre-deploy) ==="
          echo "PROJECT_REF env                  : $PROJECT_REF"
          echo "confirm_ref input                : ${{ inputs.confirm_ref }}"
          echo "Expected target ref              : yparkrguxoektihjpynr"
          echo "Deploy target URL (functions/v1) : https://${PROJECT_REF}.supabase.co/functions/v1/mcp"
          echo "Expected OAuth issuer            : https://${PROJECT_REF}.supabase.co/auth/v1"
          echo
          echo "=== Supabase CLI link status ==="
          # `supabase projects list` shows a LINKED marker next to the currently linked project.
          supabase projects list || true
          echo
          echo "=== Generated function issuer line (from bundled source) ==="
          grep -nE 'projectRef|supabase\.co/auth/v1' supabase/functions/mcp/index.ts | head -10 || true
          echo
          echo "=== Generated function content hash (pre-deploy) ==="
          sha256sum supabase/functions/mcp/index.ts
          wc -c supabase/functions/mcp/index.ts

      - name: "Stage M · Deploy ONLY the mcp function"
        if: ${{ inputs.stage == 'mcp-only' }}
        run: |
          set -euo pipefail
          echo "Deploying ONLY 'mcp' to project ref: $PROJECT_REF"
          echo "  (deploy URL derived by CLI: https://${PROJECT_REF}.supabase.co/functions/v1/mcp)"
          supabase functions deploy mcp --project-ref "$PROJECT_REF"
          echo "  ✓ mcp deploy command completed for $PROJECT_REF."

      - name: "Stage M · Post-deploy: list functions on target project"
        if: ${{ inputs.stage == 'mcp-only' }}
        run: |
          set -euo pipefail
          echo "=== supabase functions list --project-ref $PROJECT_REF ==="
          supabase functions list --project-ref "$PROJECT_REF" | tee /tmp/fnlist.txt
          echo
          echo "=== mcp row(s) only ==="
          grep -iE '(^|\|)\s*mcp\s*(\||$)' /tmp/fnlist.txt || echo "::error::No 'mcp' row found in functions list for $PROJECT_REF"
          echo
          echo "=== Local source hash of what was just deployed ==="
          sha256sum supabase/functions/mcp/index.ts

      - name: "Stage M · Verify deployed MCP endpoint advertises target issuer"
        if: ${{ inputs.stage == 'mcp-only' }}
        run: |
          set -euo pipefail
          BASE="https://${PROJECT_REF}.supabase.co/functions/v1/mcp"
          EXPECTED_ISSUER="https://${PROJECT_REF}.supabase.co/auth/v1"

          echo "=== VERIFICATION TARGET (must equal deploy target) ==="
          echo "  PROJECT_REF          : $PROJECT_REF"
          echo "  Verification BASE URL: $BASE"
          echo "  Expected issuer      : $EXPECTED_ISSUER"
          if [ "$PROJECT_REF" != "yparkrguxoektihjpynr" ]; then
            echo "::error::PROJECT_REF ($PROJECT_REF) is NOT the expected target yparkrguxoektihjpynr."
            exit 1
          fi

          echo
          echo "=== DNS resolution for ${PROJECT_REF}.supabase.co ==="
          getent hosts "${PROJECT_REF}.supabase.co" || true

          echo
          echo "Probing $BASE (expect 401 with WWW-Authenticate)…"
          headers=$(curl -sS -D - -o /tmp/mcp_body.$$ -X POST \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize"}' \
            --max-time 15 "$BASE" || true)
          echo "--- response headers ---"
          echo "$headers" | tr -d '\r' | sed 's/^/  /'
          echo "--- response body (first 40 lines) ---"
          head -40 /tmp/mcp_body.$$ 2>/dev/null | sed 's/^/  /' || true
          rm -f /tmp/mcp_body.$$

          if ! echo "$headers" | grep -qi '^HTTP/.* 401'; then
            echo "::error::Expected HTTP 401 challenge from $BASE."
            exit 1
          fi
          if ! echo "$headers" | grep -qi 'WWW-Authenticate:.*Bearer'; then
            echo "::error::Missing WWW-Authenticate: Bearer challenge."
            exit 1
          fi

          RES_META="$BASE/.well-known/oauth-protected-resource"
          echo
          echo "Fetching $RES_META …"
          body=$(curl -fsS --max-time 15 "$RES_META")
          echo "$body" | sed 's/^/  /'
          if ! echo "$body" | grep -q "\"$EXPECTED_ISSUER\""; then
            echo "::error::Protected-resource metadata does not advertise expected issuer $EXPECTED_ISSUER."
            exit 1
          fi
          echo "  ✓ MCP endpoint on $PROJECT_REF reports issuer $EXPECTED_ISSUER."


      # -----------------------------------------------------------------
      # STAGE 7 — Report required target Edge Function secrets (names only)
      # -----------------------------------------------------------------
      - name: "Stage 7 · Report required edge-function secrets (names only)"
        if: ${{ inputs.stage != 'readiness-only' && inputs.stage != 'verify-only' && inputs.stage != 'repair-history' && inputs.stage != 'mcp-only' }}
        run: |
          set -euo pipefail
          echo "Required secret NAMES for edge functions on $PROJECT_REF:"
          cat <<'EOF'
            - OPENAI_API_KEY
            - ELEVENLABS_API_KEY
            - LOVABLE_API_KEY
            - GOOGLE_SEARCH_CONSOLE_API_KEY
            - SENTRY_DSN
            - SENTRY_ORG
            - SENTRY_PROJECT
            - SENTRY_AUTH_TOKEN
            - AI_PLAN_SIGNING_SECRET
            - SECRETS_ENCRYPTION_KEY
          EOF
          echo
          echo "Secret NAMES currently set on target (values NOT printed):"
          # `supabase secrets list` prints names + digests, never values.
          supabase secrets list --project-ref "$PROJECT_REF" || true
          echo
          echo "::notice::If any required name above is missing from the list, set it in the"
          echo "::notice::Supabase Dashboard → Project Settings → Edge Functions → Secrets."
          echo "::notice::This workflow will NOT set secrets — values must never pass through CI logs."

      # -----------------------------------------------------------------
      # STAGE 8 — Post-deployment verification summary
      # -----------------------------------------------------------------
      - name: "Stage 8 · Post-deployment summary"
        if: ${{ always() }}
        run: |
          set +e
          {
            echo "## Supabase cutover — stage: ${{ inputs.stage }}"
            echo ""
            echo "- Target project ref: \`$PROJECT_REF\`"
            echo "- Job status: ${{ job.status }}"
            echo ""
            echo "### Migrations on target"
            echo '```'
            supabase migration list --linked 2>&1 | tail -n 60
            echo '```'
            echo ""
            echo "### Deployed functions"
            echo '```'
            supabase functions list --project-ref "$PROJECT_REF" 2>&1 | tail -n 60
            echo '```'
            echo ""
            echo "### Secret names set on target (values redacted by CLI)"
            echo '```'
            supabase secrets list --project-ref "$PROJECT_REF" 2>&1 | tail -n 60
            echo '```'
            echo ""
            echo "> Frontend runtime configuration (Vercel env vars, admin.techvinex.com routing) was NOT changed by this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
