name: Deploy Supabase (external project)

# Manual-only. This workflow NEVER auto-runs.
# It targets the external Supabase project referenced by the
# SUPABASE_PROJECT_REF_PROD repository secret — NOT Lovable Cloud.
# Do not add push/pull_request triggers.

on:
  workflow_dispatch:
    inputs:
      action:
        description: What to deploy
        required: true
        default: migrate-only
        type: choice
        options:
          - migrate-only
          - functions-only
          - full
      confirm_ref:
        description: Type the target project ref to confirm (safety check)
        required: true
        type: string

concurrency:
  group: deploy-supabase-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF_PROD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard — required secrets present
        run: |
          set -e
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "Missing SUPABASE_ACCESS_TOKEN"; exit 1; }
          [ -n "$PROJECT_REF" ]           || { echo "Missing SUPABASE_PROJECT_REF_PROD"; exit 1; }
          [ -n "$SUPABASE_DB_PASSWORD" ]  || { echo "Missing SUPABASE_DB_PASSWORD"; exit 1; }

      - name: Guard — confirm ref matches secret
        run: |
          if [ "${{ inputs.confirm_ref }}" != "$PROJECT_REF" ]; then
            echo "confirm_ref (${{ inputs.confirm_ref }}) does not match SUPABASE_PROJECT_REF_PROD."
            echo "Refusing to deploy."
            exit 1
          fi

      - name: Guard — refuse Lovable Cloud project ref
        run: |
          if [ "$PROJECT_REF" = "xfgyzcvrvgsntjenxecp" ]; then
            echo "SUPABASE_PROJECT_REF_PROD points at Lovable Cloud. Refusing."
            exit 1
          fi

      - name: Guard — config.toml points at target
        run: node scripts/check-supabase-config.mjs

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Push migrations
        if: inputs.action == 'migrate-only' || inputs.action == 'full'
        run: supabase db push

      - name: Deploy edge functions
        if: inputs.action == 'functions-only' || inputs.action == 'full'
        run: |
          set -e
          for dir in supabase/functions/*/; do
            name="$(basename "$dir")"
            if [ "$name" = "_shared" ]; then continue; fi
            echo "::group::deploy $name"
            supabase functions deploy "$name" --project-ref "$PROJECT_REF"
            echo "::endgroup::"
          done
