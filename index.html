<!doctype html>

    <!-- Defense-in-depth security headers (HSTS / CSP enforcement requires hosting config) -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Permissions-Policy" content="geolocation=(), microphone=(self), camera=(self), payment=()" />

    <!-- TODO: Set the document title to the name of your application -->
    <title>Techvinex – AI Powered Job & Hiring Platform</title>
    <link rel="canonical" href="https://techvinex.com/" />
    <style>
      #splash-screen {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; align-items: center; justify-content: center;
        flex-direction: column; gap: 1rem;
        background: #ffffff;
      }
      .splash-dots {
        display: flex; gap: 6px; align-items: center;
      }
      .splash-dots span {
        width: 10px; height: 10px; border-radius: 50%;
        background: #7c3aed;
        animation: splash-bounce 1.2s ease-in-out infinite;
      }
      .splash-dots span:nth-child(1) { animation-delay: 0s; }
      .splash-dots span:nth-child(2) { animation-delay: 0.1s; }
      .splash-dots span:nth-child(3) { animation-delay: 0.2s; }
      .splash-dots span:nth-child(4) { animation-delay: 0.3s; }
      .splash-dots span:nth-child(5) { animation-delay: 0.4s; }
      .splash-dots span:nth-child(6) { animation-delay: 0.5s; }
      @keyframes splash-bounce {
        0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
        40% { transform: scale(1); opacity: 1; }
      }
      .splash-text {
        font-family: system-ui, sans-serif;
        font-size: 0.85rem; color: #7c3aed; opacity: 0.7;
      }
    </style>
    <meta name="description" content="Techvinex is an AI powered job and hiring platform connecting top professionals with leading companies. Discover jobs, AI matching, referrals and career growth." />
    <meta name="author" content="Techvinex" />
    <meta name="keywords" content="Techvinex, AI jobs, hiring platform, remote jobs, job search, AI matching, referrals, career growth, employers, recruiting" />

    <meta property="og:title" content="Techvinex – AI Powered Job & Hiring Platform" />
    <meta property="og:description" content="Find your next role or hire top talent on Techvinex. AI matching, vetted opportunities, referrals and remote friendly jobs." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://techvinex.com/" />
    <meta property="og:site_name" content="Techvinex" />
    <meta property="og:image" content="https://techvinex.com/og-image.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Techvinex – AI Powered Job & Hiring Platform" />
    <meta name="twitter:description" content="AI powered job and hiring platform. Discover roles, get matched, and grow your career with Techvinex." />
    <meta name="twitter:image" content="https://techvinex.com/og-image.png" />
