<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- TODO: Set the document title to the name of your application -->
    <title>Jetra X</title>
    <style>
      #splash-screen {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; align-items: center; justify-content: center;
        background: #ffffff;
      }
      .splash-x {
        position: relative;
        width: 5rem;
        height: 5rem;
        animation: splash-pulse 1.3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .splash-x span {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 4rem;
        height: 0.6rem;
        border-radius: 9999px;
        background: #7c3aed;
        transform-origin: center;
        opacity: 0;
      }
      .splash-x span:first-child {
        animation: splash-line1 1.3s ease-in-out infinite;
      }
      .splash-x span:last-child {
        animation: splash-line2 1.3s ease-in-out infinite;
      }
      @keyframes splash-pulse {
        0%, 10% { opacity: 0; transform: scale(0.72); }
        18%, 72% { opacity: 1; transform: scale(1); }
        88% { opacity: 0.8; transform: scale(1.04); }
        100% { opacity: 0; transform: scale(1.08); }
      }
      @keyframes splash-line1 {
        0%, 12% { opacity: 1; transform: translate(-50%, -50%) rotate(45deg) scaleX(0); }
        42%, 72% { opacity: 1; transform: translate(-50%, -50%) rotate(45deg) scaleX(1); }
        100% { opacity: 0; transform: translate(-50%, -50%) rotate(45deg) scaleX(0); }
      }
      @keyframes splash-line2 {
        0%, 28% { opacity: 1; transform: translate(-50%, -50%) rotate(-45deg) scaleX(0); }
        58%, 72% { opacity: 1; transform: translate(-50%, -50%) rotate(-45deg) scaleX(1); }
        100% { opacity: 0; transform: translate(-50%, -50%) rotate(-45deg) scaleX(0); }
      }
    </style>
    <meta name="description" content="Jetra X - Find your next opportunity" />
    <meta name="author" content="Jetra X" />

    <meta property="og:title" content="Jetra X" />
    <meta property="og:description" content="Jetra X - Find your next opportunity" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@Lovable" />
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />
  </head>

  <body>
    <div id="splash-screen"><div class="splash-x"><span></span><span></span></div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
