<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- TODO: Set the document title to the name of your application -->
    <title>Jetra X</title>
    <style>
      #splash-screen {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; align-items: center; justify-content: center;
        flex-direction: column; gap: 1rem;
        background: #ffffff;
      }
      .splash-dots {
        display: flex; gap: 6px; align-items: center;
      }
      .splash-dots span {
        width: 10px; height: 10px; border-radius: 50%;
        background: #7c3aed;
        animation: splash-bounce 1.2s ease-in-out infinite;
      }
      .splash-dots span:nth-child(1) { animation-delay: 0s; }
      .splash-dots span:nth-child(2) { animation-delay: 0.1s; }
      .splash-dots span:nth-child(3) { animation-delay: 0.2s; }
      .splash-dots span:nth-child(4) { animation-delay: 0.3s; }
      .splash-dots span:nth-child(5) { animation-delay: 0.4s; }
      .splash-dots span:nth-child(6) { animation-delay: 0.5s; }
      @keyframes splash-bounce {
        0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
        40% { transform: scale(1); opacity: 1; }
      }
      .splash-text {
        font-family: system-ui, sans-serif;
        font-size: 0.85rem; color: #7c3aed; opacity: 0.7;
      }
    </style>
    <meta name="description" content="Jetra X - Find your next opportunity" />
    <meta name="author" content="Jetra X" />

    <meta property="og:title" content="Jetra X" />
    <meta property="og:description" content="Jetra X - Find your next opportunity" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@Lovable" />
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />
  </head>

  <body>
    <div id="splash-screen"><div class="splash-dots"><span></span><span></span><span></span><span></span><span></span><span></span></div><p class="splash-text">Loading…</p></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
